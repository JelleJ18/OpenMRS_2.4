name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore CommunicationModule.sln

      - name: Build
        run: dotnet build CommunicationModule.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/CommunicationModule.Tests/CommunicationModule.Tests.csproj -c Release --no-build