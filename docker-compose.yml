services:
  api:
    build:
      context: .
      dockerfile: src/CommunicationModule.Api/Dockerfile
    ports:
      - "5079:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Profile: Production
      ConnectionStrings__ProductionConnection: ${ConnectionStrings__ProductionConnection}
      Crypto__Key: ${Crypto__Key}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
    restart: unless-stopped
    depends_on:
      - rabbitmq
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped
    depends_on:
      - api
  grafana:
    image: grafana/grafana-oss:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
  dashboard:
    build:
      context: .
      dockerfile: src/CommunicationModule.Dashboard/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ApiBaseUrl: http://api:8080
    restart: unless-stopped
    depends_on:
      - rabbitmq
  rabbitmq:
    image: rabbitmq:alpine
    ports:
      - "5672:5672"
    restart: unless-stopped

volumes:
  grafana-data: